name: Release

# Publishes to npm when a version tag is pushed (e.g. `git tag v0.1.0 && git push --tags`).
# Authenticates via npm Trusted Publishing (OIDC) — no NPM_TOKEN secret required.
# Requires a Trusted Publisher configured for this package on npmjs.com
# (repo: khoi03/slopshield, workflow: release.yml).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # required for Trusted Publishing (OIDC) and provenance

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      # Trusted Publishing requires npm >= 11.5.1. Pin to the last stable 11.x
      # rather than @latest: npm 12.0.0 ships a broken provenance path
      # (`Cannot find module 'sigstore'` from libnpmpublish), which fails
      # `npm publish --provenance`. Bump deliberately once 12.x is fixed.
      - run: npm install -g npm@11.18.0
      - name: Publish to npm (Trusted Publishing + provenance)
        run: npm publish --provenance --access public
